# Usage local : docker compose up
# Démarre l'API + une base PostgreSQL prête à l'emploi. Pensez à lancer les migrations
# et le seed une fois les conteneurs démarrés :
#   docker compose exec api npm run migrate
#   docker compose exec api npm run seed
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: univers_plus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: univers_plus
      DB_USER: postgres
      DB_PASSWORD: changeme
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5500}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}

volumes:
  db_data:
